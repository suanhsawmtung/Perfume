<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/dark-mode-logo.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/light-mode-logo.svg"
      media="(prefers-color-scheme: light)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azue Perfume House | Discover Your Signature Scent</title>

    <meta
      name="description"
      content="Explore exquisite fragrances from trusted perfume brands and discover your signature scent at Azue Perfume House."
    />

    <link rel="canonical" href="%VITE_BASE_URL%" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Azue Perfume House | Discover Your Signature Scent"
    />
    <meta
      property="og:description"
      content="Explore exquisite fragrances from trusted perfume brands and discover your signature scent at Azue Perfume House."
    />
    <meta
      property="og:image"
      content="%VITE_BASE_URL%/azue-perfume-house-brand-image.png"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_BASE_URL%" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Azue Perfume House | Discover Your Signature Scent"
    />
    <meta
      name="twitter:description"
      content="Explore exquisite fragrances from trusted perfume brands and discover your signature scent at Azue Perfume House."
    />
    <meta
      name="twitter:image"
      content="%VITE_BASE_URL%/azue-perfume-house-brand-image.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Azue Perfume House",
            "url": "%VITE_BASE_URL%"
          },
          {
            "@type": "WebSite",
            "name": "Azue Perfume House",
            "url": "%VITE_BASE_URL%"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
